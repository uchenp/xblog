name: Update Macro Data

on:
  schedule:
    # 每月 1 号和 15 号 UTC 02:00 (北京时间 10:00) 自动刷新数据
    - cron: '0 2 1,15 * *'
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install akshare
        run: pip install akshare --quiet

      - name: Fetch macro data
        run: |
          mkdir -p public/data
          python3 scripts/fetch-macro-data.py > public/data/macro.json

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet public/data/macro.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/macro.json
          git commit -m "chore: auto-update macro data $(date +%Y-%m-%d)"
          git push
